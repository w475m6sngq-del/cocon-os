# クラウド（Supabase）の一時停止を防ぐため、毎日1回だけ「生きてる？」と確認する
name: supabase-keepalive
on:
  schedule:
    - cron: '0 0 * * *'   # 毎日 朝9時（日本時間）
  workflow_dispatch:       # 手動でも実行できる
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS -X POST "https://lvznnctbgojsfoaytyio.supabase.co/rest/v1/rpc/keepalive" \
            -H "apikey: sb_publishable_Og92JvF18YsMuTlq1TjOEg_h6L4WIko" \
            -H "Content-Type: application/json" -d '{}'
